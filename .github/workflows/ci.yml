name: CI

# Runs on every pull request: the same checks as a deploy, without
# publishing. `main` requires this job to pass before a PR can merge.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # list the posts a PR changes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run sync:check

      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      # The diagram grammar (docs/authoring.md#diagrams-enforced) is strict for
      # posts this PR adds or edits. Older posts are cleaned up separately.
      - name: Diagram grammar on changed posts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slugs=$(gh pr diff ${{ github.event.number }} --repo ${{ github.repository }} --name-only \
            | grep -E '^front/public/blog/posts/.+\.md$' \
            | while read -r f; do [ -f "../$f" ] && basename "$f" .md; done || true)
          if [ -z "$slugs" ]; then echo "No posts changed."; exit 0; fi
          npm run diagrams:lint -- --strict $slugs

      # prebuild runs validate-links, so a broken link between posts fails here.
      - name: Build
        run: npm run build
        env:
          CI: false
          AUDIO_BASE_URL_EN: https://pub-00d57ee081654fe389ef2660b8f38f69.r2.dev/audio
          AUDIO_BASE_URL_ES: https://pub-00d57ee081654fe389ef2660b8f38f69.r2.dev/audio-es
