name: Deploy

# Builds the site and publishes it with GitHub Pages' native Actions
# deployment. No deploy branch: the build is uploaded as an artifact and
# served directly, so nothing accumulates in the repository.

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a deploy
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run sync:check

      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Optimize new images
        run: |
          # Only images without a WebP twin; already-optimized files are skipped.
          missing=0
          while IFS= read -r img; do
            [ -f "${img%.*}.webp" ] || missing=$((missing + 1))
          done < <(find public/images public/blog/headers -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) ! -name '*-original.*' ! -name '*-optimized.*')
          echo "Images without a WebP twin: $missing"
          if [ "$missing" -gt 0 ]; then npm run optimize-images; fi

      - name: Build
        run: npm run build
        env:
          CI: false
          AUDIO_BASE_URL_EN: https://pub-00d57ee081654fe389ef2660b8f38f69.r2.dev/audio
          AUDIO_BASE_URL_ES: https://pub-00d57ee081654fe389ef2660b8f38f69.r2.dev/audio-es

      - name: Summarize build
        run: |
          {
            echo "### Build"
            echo "- Posts: $(node -p "require('./src/data/blogData.json').posts.length")"
            echo "- Site size: $(du -sh build | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: front/build

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
